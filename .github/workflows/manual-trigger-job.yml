name: Manually trigger an Azure Machine Learning job

on:
  workflow_dispatch:

env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  AZURE_WORKSPACE_NAME: ${{ vars.AZURE_WORKSPACE_NAME }}

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install az ml extension
        run: az extension add --name ml --yes

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Verify Azure ML target
        run: |
          az account show
          az ml workspace show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WORKSPACE_NAME"

      - name: Run Azure Machine Learning training job
        run: |
          az ml job create \
            --file src/job.yml \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --workspace-name "$AZURE_WORKSPACE_NAME" \
            --stream